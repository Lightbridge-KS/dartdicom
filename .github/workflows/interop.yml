# Live gates (blueprint §9): the interop matrix (M3 decision 2). Orthanc in
# Docker, DCMTK from apt, and pynetdicom from fixtures/'s uv environment
# (scripts/interop_peers.sh) against dartdicom_net; then the
# retrieve_and_render example by C-GET and by C-MOVE. Nightly and on demand.
name: interop

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live gates (Orthanc, DCMTK, pynetdicom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1 # installs the Dart from mise.toml
      - uses: astral-sh/setup-uv@v10.2.0 # pynetdicom (fixtures/uv.lock)
      - name: install DCMTK (dcmqrscp, storescp, storescu)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dcmtk
      - run: dart pub get
      - name: start the test PACS
        run: scripts/pacs_up.sh
      - name: live gates (seed, the interop matrix, retrieve_and_render both ways)
        run: scripts/live_gates.sh
      - name: PACS logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs
      - name: stop the test PACS
        if: always()
        run: docker compose -f docker/compose.yaml down
