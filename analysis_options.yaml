# Shared by every workspace member (a member without its own file inherits this one).
include: package:lints/recommended.yaml

analyzer:
  exclude:
    - _playground/**   # local scratch, gitignored
    - dartdicom/test/compile_fail/**   # code that must not compile (I-24): its own check analyzes it
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A dropped Future<DimseStatus> is a lost DIMSE outcome (design D3).
    - unawaited_futures
